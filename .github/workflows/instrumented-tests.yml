name: Instrumented tests

# Runs on an actual Android emulator - this is what lets us empirically verify
# device-only behavior (accessibility event delivery, overlay window rendering) instead of
# guessing.
#
# Both the debug and the release variant are instrumented. The release run is the point of the
# matrix: R8 minification is the standing suspect for exactly the kind of silent breakage this
# project keeps hitting (manifest-referenced classes, reflectively-reached ones, resources
# reached only through <meta-data>), and neither the resolved accessibility event mask nor the
# overlay window is something a static inspection of the APK can answer - they are runtime facts
# about the shipped artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Never cancel the release job because debug failed (or vice versa): "debug passes, release
      # doesn't" IS the finding this matrix exists to produce, and it is only visible if both run.
      fail-fast: false
      matrix:
        variant: [debug, release]
    name: instrumented-tests (${{ matrix.variant }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Diagnostic: print the actual merged manifest for the variant under test, so a merge
      # conflict or missing/altered <service>/<meta-data> entry is directly visible instead
      # of inferred from behavior. Cheap (no emulator needed) so it runs even on failure.
      - name: Dump merged manifest
        run: |
          set -uo pipefail
          VARIANT='${{ matrix.variant }}'
          CAPITALIZED="$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          ./gradlew ":app:process${CAPITALIZED}Manifest"
          echo "=== Merged AndroidManifest.xml ($VARIANT) ==="
          find app/build -iname "AndroidManifest.xml" -path "*${VARIANT}*" -print -exec cat {} \;

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash .github/scripts/run_instrumented_tests.sh ${{ matrix.variant }}

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ matrix.variant }}
          path: app/build/reports/androidTests
          retention-days: 7

      # Full, unfiltered logcat - the printed-to-stdout grep is a curated guess at what's
      # relevant; this is the fallback for when that guess isn't broad enough.
      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-logcat-${{ matrix.variant }}
          path: /tmp/full-logcat-${{ matrix.variant }}.txt
          retention-days: 7
          if-no-files-found: ignore
