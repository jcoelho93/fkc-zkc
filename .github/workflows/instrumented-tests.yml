name: Instrumented tests

# Runs on an actual Android emulator - this is what lets us empirically verify
# device-only behavior (accessibility event delivery, in this case) instead of guessing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Diagnostic: print the actual merged manifest for the debug variant, so a merge
      # conflict or missing/altered <service>/<meta-data> entry is directly visible instead
      # of inferred from behavior. Cheap (no emulator needed) so it runs even on failure.
      - name: Dump merged debug manifest
        run: |
          ./gradlew :app:processDebugManifest
          echo "=== Merged AndroidManifest.xml (debug) ==="
          find app/build -iname "AndroidManifest.xml" -path "*ebug*" -print -exec cat {} \;

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat -v time > /tmp/full-logcat.txt &
            LOGCAT_PID=$!
            ./gradlew connectedDebugAndroidTest
            RESULT=$?
            sleep 2
            kill $LOGCAT_PID || true
            echo "=== Filtered logcat (accessibility / Hilt / MindfulScroll / crashes) ==="
            grep -iE "accessibility|hilt|mindfulscroll|androidruntime|fatal exception|scrollmonitor" /tmp/full-logcat.txt || echo "(no matching lines)"
            exit $RESULT

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          retention-days: 7
